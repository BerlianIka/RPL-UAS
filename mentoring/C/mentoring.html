<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard BIMA</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
  <div class="dashboard-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <img src="assets/logo-bima.png" alt="Logo BIMA" class="logo" />
      <nav class="menu">
        <a href="../../dashboard/dashboard.html"><img src="assets/icon-dashboard.png" alt="" /> Dashboard</a>
        <a href="../../peta/peta.html"><img src="assets/icon-map.png" alt="" /> Peta</a>
        <a href="../../mentoring/mentoring.html" class="active"><img src="assets/icon-bimbingan.png" alt="" /> Mentoring</a>
        <a href="../../peringkat/peringkat.html"><img src="assets/icon-peringkat.png" alt="" /> Peringkat</a>
        <a href="../../library/library.html"><img src="assets/icon-library.png" alt="" /> Library</a>
      </nav>
      <a class="logout" href="../login/1/login1.html"><img src="assets/icon-logout.png" alt="" /> Logout</a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <header>
        <div></div>
        <div class="top-right-icons">
          <button class="icon-button"><i class="fa-solid fa-bell"></i></button>
          <img src="assets/profile-dashboard.jpg" alt="Profile" class="profile-image" />
        </div>
      </header>

<div class="page-header">
  <button class="back-button">
    <img src="assets/icon-back.png" alt="Kembali" />
  </button>
  <h2 class="page-title">Pengajuan Mentoring</h2>
</div>
<div class="mentoring-form-container">
        <form class="mentoring-form">
          <label>Judul Mentoring</label>
          <input type="text" placeholder="Masukkan Judul Mentoring" />

          <label>Pilih Dosen Pembimbing</label>
          <select>
            <option>--- Dosen Pembimbing ---</option>
            <option>1. Pratama Wirya Atmaja, S.Kom. M.Kom.</option>
            <option>2. Henni Endah Wahanani, S.T., M.Kom.</option>
          </select>

          <label>Pilih tanggal mentoring</label>
          <input type="date" />

          <label>Jam Mentoring</label>
          <select>
            <option>--- Jam Mentoring ---</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16.00</option>
          </select>

          <label>File</label>
<div class="file-drop">
  <p>Drag and Drop filemu di sini,<br>atau klik unggah</p>
  <button type="button" class="upload-button">Unggah File</button>
</div>

<button id="submit" type="submit" class="submit-button">Buat Jadwal Mentoring</button>

        </form>
      </div>
    </main>
  </div>

  <script>
    // Klik ke halaman mentoring ke riwayat
document.querySelector(".back-button").addEventListener("click", function () {
  window.location.href = "../2/mentoring.html";
 });

  </script>
</body>
</html>
