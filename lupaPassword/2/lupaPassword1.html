<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lupa Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body, html {
      height: 100%;
    }

    .container {
      width: 100%;
      height: 100vh;
      background: url('assets/bg-login1.png') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box {
      background: linear-gradient(90deg, rgba(34,34,59,0.9) 0%, rgba(0,255,198,0.3) 100%);
      padding: 30px 60px;
      border-radius: 20px;
      width: 100%;
      max-width: 800px;
      text-align: left;
      color: white;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }

    .form-box h2 {
      font-size: 22px;
      font-weight: bold;
      color: #ffcc70;
      margin-bottom: 5px;
    }

    .form-box h2 span {
      color: white;
    }

    .form-box p {
      font-size: 14px;
      margin-bottom: 25px;
      color: #f0f0f0;
    }

    form label {
      font-size: 14px;
      margin-bottom: 5px;
      display: block;
      color: #ffffff;
    }

    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .password-wrapper input {
      width: 100%;
      padding: 14px 50px 14px 14px; /* kanan dikasih space untuk ikon */
      border-radius: 10px;
      border: none;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
    }

    .password-wrapper .eye {
      all: unset;
      position: absolute;
      top: 40%;
      right: 15px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      width: 24px;
      cursor: pointer;
    }

    .password-wrapper .eye svg {
      width: 20px;
      height: 20px;
      color: #333;
      display: block;
    }

    .submit-button {
      padding: 12px 50px;
      background: linear-gradient(90deg, #a38dfc, #c390f9);
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
      float: right;
    }

    .submit-button:hover {
      background: #9966ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-box">
      <h2><span class="highlight">Lupa Password</span></h2>
      <p>Untuk keamanan akun, jangan menyebarkan password anda</p>
      <form>
        <!-- Password Baru -->
        <label for="new-password">Password Baru</label>
        <div class="password-wrapper">
          <input type="password" id="new-password" placeholder="Masukkan password baru" required />
          <button type="button" class="eye" onclick="togglePassword(this, 'new-password')">
            <!-- Mata terbuka -->
            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M12 5c-7.633 0-11 7-11 7s3.367 7 11 7 11-7 11-7-3.367-7-11-7zm0
                12c-2.761 0-5-2.239-5-5s2.239-5 5-5 5 2.239 5 5-2.239 5-5 5zm0-8c-1.654 0-3
                1.346-3 3s1.346 3 3 3 3-1.346 3-3-1.346-3-3-3z"/>
            </svg>
            <!-- Mata tertutup -->
            <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 5c-7.633 0-11 7-11 7s3.367 7 11 7 11-7 11-7-3.367-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M3 3l18 18" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </button>
        </div>

        <!-- Konfirmasi Password -->
        <label for="confirm-password">Konfirmasi Password Baru</label>
        <div class="password-wrapper">
          <input type="password" id="confirm-password" placeholder="Masukkan password baru" required />
          <button type="button" class="eye" onclick="togglePassword(this, 'confirm-password')">
            <!-- Mata terbuka -->
            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M12 5c-7.633 0-11 7-11 7s3.367 7 11 7 11-7 11-7-3.367-7-11-7zm0
                12c-2.761 0-5-2.239-5-5s2.239-5 5-5 5 2.239 5 5-2.239 5-5 5zm0-8c-1.654 0-3
                1.346-3 3s1.346 3 3 3 3-1.346 3-3-1.346-3-3-3z"/>
            </svg>
            <!-- Mata tertutup -->
            <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 5c-7.633 0-11 7-11 7s3.367 7 11 7 11-7 11-7-3.367-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M3 3l18 18" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="submit-button">Ubah Password</button>
      </form>
    </div>
  </div>

  <script>
    function togglePassword(button, inputId) {
      const input = document.getElementById(inputId);
      const eyeOpen = button.querySelector('.eye-open');
      const eyeClosed = button.querySelector('.eye-closed');

      if (!input || !eyeOpen || !eyeClosed) return;

      if (input.type === "password") {
        input.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "inline";
      } else {
        input.type = "password";
        eyeOpen.style.display = "inline";
        eyeClosed.style.display = "none";
      }
    }
  </script>
</body>
</html>
